<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PUMO Story Lab · Day 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{
  --ink:#0E1630; --navy:#1F3864; --sky:#E6F0FF; --dot:#C4D7F5; --paper:#FFFFFF; --soft:#F4F8FF;
  --gold:#FFC20E; --orange:#FF9A0D; --blue:#2F6BF2; --green:#16B157; --red:#F2383A; --grey:#5B6787;
  --accent:var(--gold);
  --display:"Fredoka","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--sky);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);line-height:1.02;margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* hanging crew */
.hang{position:absolute;width:0;height:0;transform-origin:0 0;animation:swing var(--dur,3.4s) ease-in-out infinite;animation-delay:var(--del,0s);pointer-events:none;z-index:3}
.hang .rope{position:absolute;left:-1px;top:0;width:2px;height:var(--L);background:var(--ink);border-radius:2px}
.hang img{position:absolute;width:var(--sw);max-width:none;left:calc(var(--sw) * var(--hx) * -1);top:calc(var(--L) - var(--sw) * var(--ar) * var(--hy));filter:drop-shadow(0 3px 0 rgba(14,22,48,.18))}
.hang.two .rope{left:calc(var(--sw) * var(--a) - 1px)}
.hang.two .rope+.rope{left:calc(var(--sw) * var(--b) - 1px)}
.hang.two img{left:calc(var(--sw) * -.5)}
@keyframes swing{0%,100%{transform:rotate(var(--amp,8deg))}50%{transform:rotate(calc(var(--amp,8deg) * -1))}}
.jiggle:hover .hang,.jiggle:focus-visible .hang{--amp:20deg;--dur:.8s}
.perch{position:absolute;pointer-events:none;z-index:3;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}

/* header */
.band{background:var(--navy);color:#FFFFFF}
.band .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;flex-wrap:wrap}
.band .wrap span:last-child{opacity:.75}
.hero{padding-block:34px 10px;text-align:center}
.title{display:inline-block;font-size:clamp(64px,13vw,132px);font-weight:700;letter-spacing:-.02em;line-height:.9;position:relative;margin-bottom:96px}
.title .l{position:relative;display:inline-block;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.title .c1{color:var(--gold)}.title .c2{color:var(--blue)}.title .c3{color:var(--red)}.title .c4{color:var(--green)}.title .c5{color:#FFFFFF}
.title .sp{display:inline-block;width:.28em}
.sub{font-size:clamp(16px,2.2vw,20px);font-weight:700;color:var(--navy);max-width:640px;margin:0 auto}
.me-row{display:flex;justify-content:center;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:20px}
.me-row label{display:flex;flex-direction:column;gap:4px;text-align:left;font-family:var(--display);font-weight:600;font-size:16px}
.me-row input{width:220px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:26px 0 92px}
.tab{position:relative;display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);text-decoration:none;font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1;transition:transform .15s,box-shadow .15s,background .2s}
.tab .n{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-size:17px;background:var(--soft)}
.tab:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--ink)}
.tab[aria-current="page"]{background:var(--tabc)}
.tab[aria-current="page"] .n{background:#FFFFFF}
.tab small{display:block;font-family:var(--body);font-weight:700;font-size:12px;opacity:.7;letter-spacing:.04em}

/* station chrome */
main{padding-bottom:80px}
.st-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{display:inline-block;font-family:var(--display);font-weight:600;font-size:15px;background:var(--ink);color:#FFFFFF;padding:3px 12px;border-radius:999px;margin-bottom:10px}
.st-head h2{font-size:clamp(34px,5vw,54px);position:relative}
.tip{display:flex;gap:12px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;max-width:520px;font-weight:600;font-size:15px;box-shadow:0 5px 0 var(--ink)}
.tip img{width:46px;flex:none}
.box{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 7px 0 var(--ink);padding:22px;min-width:0;position:relative}
.box h3{font-size:26px;margin-bottom:4px}
.box .lede{color:var(--grey);font-weight:600;font-size:15px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:26px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mt{margin-top:26px}
label.f{display:flex;flex-direction:column;gap:5px;font-family:var(--display);font-weight:600;font-size:17px}
label.f .hint{font-family:var(--body);font-weight:600;font-size:13px;color:var(--grey)}
.field{display:flex;gap:8px}
input[type=text],textarea{width:100%;min-width:0;background:var(--soft);border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:15.5px;font-weight:600}
textarea{resize:vertical;min-height:70px}
input[type=text]:focus,textarea:focus{outline:none;background:#FFFFFF;box-shadow:0 0 0 4px var(--accent)}
input[type=range]{accent-color:var(--navy);width:100%}
::placeholder{color:#8A94AE;font-weight:600}
.btn{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:14px;padding:9px 16px;font-family:var(--display);font-weight:600;font-size:17px;background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--ink);text-decoration:none;position:relative;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.main{background:var(--accent)}
.btn.big{font-size:21px;padding:13px 22px;border-radius:18px}
.btn.sm{font-size:14px;padding:5px 11px;border-width:2.5px;box-shadow:0 4px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.dice{appearance:none;flex:none;width:48px;border:2.5px solid var(--ink);border-radius:12px;background:var(--gold);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 var(--ink);transition:transform .1s}
.dice:active{transform:translateY(3px) rotate(20deg);box-shadow:0 1px 0 var(--ink)}
.dice svg{width:24px;height:24px}
.ai-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px;padding-bottom:6px}
.ai{justify-content:center;flex-direction:column;gap:0;padding:10px 8px;text-align:center}
.ai b{font-size:20px}
.ai small{font-family:var(--body);font-weight:700;font-size:12px;opacity:.75}
.ai.g{background:#E7F0FF}.ai.c{background:#E3FAEC}.ai.a{background:#FFE9DC}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);background:var(--ink);color:#FFFFFF;font-weight:700;padding:11px 20px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.copyfall{margin-top:10px}.copyfall textarea{min-height:110px;font-size:13px}
.note{font-size:13px;color:var(--grey);font-weight:600}

.ticket{background:var(--soft);border:2.5px dashed var(--ink);border-radius:16px;padding:16px 18px;font-size:16px;font-weight:600;line-height:1.7;white-space:pre-line;overflow-wrap:anywhere}
.ticket mark{background:var(--gold);color:var(--ink);border-radius:6px;padding:0 5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ticket mark.empty{background:#FFD9D9;color:var(--red)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.step{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.step i{flex:none;font-style:normal;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);background:var(--accent)}

.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{appearance:none;border:2px solid var(--ink);background:var(--soft);border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:800;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#FFFFFF}
.chip.w[aria-pressed="true"]{background:var(--orange);color:var(--ink)}
.chip.c[aria-pressed="true"]{background:#7FA8F5;color:var(--ink)}
.chip.d[aria-pressed="true"]{background:#2B2846;color:#FFFFFF}
/* day 2: script */
.meterbar{position:sticky;top:8px;z-index:4;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 16px;margin-bottom:18px}
.meterbar .big{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.track{flex:1;min-width:180px;height:16px;border:2.5px solid var(--ink);border-radius:999px;background:var(--soft);overflow:hidden;position:relative}
.track i{display:block;height:100%;background:var(--gold);transition:width .3s}
.track.ok i{background:var(--green)}.track.over i{background:var(--red)}
.track b{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink)}
.lines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sline{border:3px solid var(--ink);border-radius:18px;background:#FFFFFF;box-shadow:0 4px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sline .top{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:3px solid var(--ink);background:var(--soft)}
.sline .thumb{width:84px;aspect-ratio:16/9;border-radius:8px;border:2px solid var(--ink);object-fit:cover;flex:none;background:#E9F0FC}
.sline .what{font-size:13px;font-weight:700;color:var(--grey);min-width:0;overflow-wrap:anywhere}
.sline .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.lab2{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:14px}
.lab2 .who{flex:none;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--ink);border-radius:999px;padding:1px 8px}
.who.n{background:var(--navy);color:#FFFFFF}.who.c{background:var(--gold)}.who.s{background:var(--orange)}
.sline textarea{min-height:64px;font-size:14.5px}
.sline .cnt{margin-left:auto;white-space:nowrap;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;border:2px solid var(--ink);background:#FFFFFF}
.cnt.hi{background:#FFD3D3}
.charrow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px}
.edited{font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;border:2px solid var(--ink);background:#CFE0FF}
/* day 2: voice + video */
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:start;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;background:#FFFFFF}
.vrow .txt{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.vrow .fn{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--grey);margin-top:2px}
.vrow.done{background:#E3FAEC}
.vrow .acts{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tick{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;cursor:pointer}
.tick input{width:20px;height:20px;accent-color:var(--green)}
.picks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.pickf{position:relative;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#FFFFFF;cursor:pointer;box-shadow:0 4px 0 var(--ink);text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column}
.pickf .im{aspect-ratio:16/9;background:#E9F0FC;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:26px}
.pickf .im img{width:100%;height:100%;object-fit:cover}
.pickf span{font-size:12px;font-weight:700;padding:6px 8px;overflow-wrap:anywhere}
.pickf[aria-pressed="true"]{background:var(--gold);outline:4px solid var(--orange);outline-offset:2px}
.pickf .star2{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);background:#FFFFFF;display:grid;place-items:center;font-weight:800}
.pickf[aria-pressed="true"] .star2{background:var(--orange)}
.hero2{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px}
.hero2 .frameimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;border:3px solid var(--ink);background:#E9F0FC;display:grid;place-items:center;font-family:var(--display);font-size:20px}
.tools4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tools4 .btn{flex-direction:column;gap:0;justify-content:center;text-align:center;padding:8px 6px;font-size:15px}
.tools4 .btn small{font-family:var(--body);font-size:11px;font-weight:700;opacity:.75}
.tools4 .btn.used{background:#C9F2D9}
.tries{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;flex-wrap:wrap}
.tries i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);background:#FFFFFF;display:inline-block}
.tries i.on{background:var(--orange)}
.warn{background:#FFF4D6;border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
.stills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.still{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;border:2.5px solid var(--ink);border-radius:14px;padding:10px;background:#FFFFFF}
.still.done{background:#E3FAEC}
.still img,.still .ph2{width:110px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:2px solid var(--ink);background:#E9F0FC;display:grid;place-items:center;font-family:var(--display);font-weight:700}

#mini{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){ .grid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:600px){ .steps,.ai-row{grid-template-columns:minmax(0,1fr)!important} .title{margin-bottom:80px} .tab small{display:none} }
@media (prefers-reduced-motion:reduce){ .hang,.perch{animation:none!important} }
/* ===== Day 2 lab ===== */
.daytag{display:inline-block;font-family:var(--display);font-weight:700;font-size:20px;background:var(--gold);border:3px solid var(--ink);border-radius:999px;padding:2px 16px;box-shadow:0 4px 0 var(--ink);transform:rotate(-4deg);margin-bottom:14px}
.tabs{grid-template-columns:repeat(3,minmax(0,1fr));max-width:920px;margin-left:auto;margin-right:auto}
.me-row .btn.sm{align-self:flex-end}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FFF4D6;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:22px}
.confetti i{position:absolute;top:-10px;width:10px;height:14px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
.lab2 .who{flex:none}
/* insights */
.ins{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:24px;margin-top:14px}
.bigstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.bs{border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;background:var(--soft)}
.bs.ok{background:#E3FAEC}.bs.warn{background:#FFF1CC}
.bs b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.bs span{font-size:12.5px;font-weight:800;color:var(--grey)}
.splitlab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800;font-size:14px;margin-bottom:6px}
.split{display:flex;height:44px;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--soft)}
.split i{display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;min-width:0;transition:flex-basis .3s}
.split i+i{border-left:3px solid var(--ink)}
.split .n,.bar .n{background:var(--navy);color:#FFFFFF}.split .c,.bar .c{background:var(--gold)}.split .s,.bar .s{background:var(--orange)}
.aim{position:relative;height:30px;margin-top:6px;border-radius:10px}
.aim::before{content:"";position:absolute;left:0;right:0;top:5px;height:6px;border-radius:999px;background:#D6E0F2;border:1.5px solid var(--ink)}
.aim .zone{z-index:1}.aim .you{z-index:2}
.scrolly{max-height:320px;overflow:auto;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.scrolly:hover,.scrolly:focus{-webkit-mask-image:none;mask-image:none}
.aim .zone{position:absolute;top:0;height:16px;background:repeating-linear-gradient(45deg,#C9F2D9 0 6px,#E3FAEC 6px 12px);border:2px solid var(--green);border-radius:6px}
.aim .you{position:absolute;top:-4px;width:4px;height:22px;background:var(--ink);border-radius:2px;transform:translateX(-50%);transition:left .3s}
.aim small{position:absolute;bottom:-4px;font-size:11.5px;font-weight:800;color:var(--grey);white-space:nowrap}
.voices3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.vcard{border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;background:#FFFFFF;min-width:0}
.vcard h4{margin:0 0 6px;font-family:var(--display);font-size:17px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vcard p{font-size:13px;font-weight:700;color:var(--grey);overflow-wrap:anywhere}
.vcard p b{color:var(--ink)}
.scenebars{display:flex;flex-direction:column;gap:7px;margin-top:18px}
.sb{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12.5px;font-weight:800}
.sb .bar{display:flex;height:20px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--soft)}
.sb .bar i{display:block;height:100%}
.sb .lim{color:var(--red)}
.coach{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.coach li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px;background:#FFFFFF}
.coach li i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);font-size:13px;font-weight:800;background:var(--gold)}
.coach li.ok{background:#E3FAEC}.coach li.ok i{background:var(--green);color:#FFFFFF}
.starring{font-family:var(--display);font-weight:600;font-size:18px;color:var(--grey)}
.starring b{color:var(--ink)}
.sline .pic{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.sline .pic span{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--ink);border-radius:999px;padding:1px 8px;background:#FFFFFF}
.sline .pic input{font-size:13.5px;padding:6px 10px;background:#FFFFFF}
/* video lab */
.timeline{display:flex;gap:5px;min-height:70px}
.tl{min-width:0;border:2.5px solid var(--ink);border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:800;font-size:11.5px;line-height:1.2;text-align:center;overflow:hidden;padding:4px 2px;text-decoration:none;color:var(--ink);transition:flex-grow .3s}
.tl.clip{background:var(--orange)}.tl.still{background:#DCE4F3}
.tl b{font-family:var(--display);font-size:20px;line-height:1}
.legend2{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-weight:800;font-size:13px}
.legend2 span{display:flex;align-items:center;gap:6px}
.legend2 i{width:18px;height:14px;border:2px solid var(--ink);border-radius:4px;display:inline-block}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.shotcard{scroll-margin-top:20px}
.sh-top{display:grid;grid-template-columns:220px minmax(0,1fr) auto;gap:16px;align-items:start}
.sh-thumb{appearance:none;font:inherit;color:inherit;width:100%;aspect-ratio:16/9;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:repeating-linear-gradient(45deg,#F4F8FF 0 12px,#E9F0FC 12px 24px);display:grid;place-items:center;cursor:pointer;font-family:var(--display);font-weight:600;font-size:14px;text-align:center;padding:0}
.sh-thumb img{width:100%;height:100%;object-fit:cover}
.sh-thumb small{display:block;font-family:var(--body);font-size:11.5px;color:var(--grey)}
.sh-meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.sh-meta h3{font-size:24px;margin:0}
.said{font-size:14px;font-weight:700;color:var(--navy);font-style:italic;overflow-wrap:anywhere}
.what2{font-size:14px;font-weight:700;color:var(--grey);overflow-wrap:anywhere}
.secs{border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px;background:#FFFFFF;white-space:nowrap}
.recbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2.5px dashed var(--ink);border-radius:12px;padding:10px 12px;margin:14px 0 12px;font-weight:700;font-size:14px}
.recbox.clip{background:#FFE7C7}.recbox.still{background:#EAF0FB}
.recbox b{font-family:var(--display);font-size:17px}
.ctrls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ctrls .lab2{margin-bottom:4px}
.chip.auto{position:relative}
.chip.auto::after{content:"auto";position:absolute;top:-9px;right:-6px;font-size:9px;background:var(--green);color:#FFFFFF;border-radius:999px;padding:0 4px;border:1.5px solid var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.pcol{display:flex;flex-direction:column;gap:8px;min-width:0;border:2.5px solid var(--ink);border-radius:16px;padding:12px;background:var(--soft)}
.pcol h4{margin:0;font-family:var(--display);font-size:19px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pcol h4 small{font-family:var(--body);font-size:12px;font-weight:800;color:var(--grey)}
.ticket.sm{font-size:13.5px;line-height:1.55;padding:12px 14px;background:#FFFFFF}
.fname{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--grey);overflow-wrap:anywhere}
.howto{font-size:14px;font-weight:700;background:#FFFFFF;border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px}
.donebar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:12px}
.shotcard.done{background:#F2FCF5}
.ready{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:22px;align-items:start}
.prog{display:flex;flex-direction:column;gap:8px}
.prog p{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:14px;border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;background:#FFFFFF}
.prog p.ok{background:#E3FAEC}
.creditroll{background:#0E1930;color:#FAF7EF;border:3px solid var(--ink);border-radius:20px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:9px;box-shadow:0 6px 0 var(--ink)}
.creditroll h4{margin:0;font-family:var(--display);font-size:26px;color:var(--gold)}
.creditroll p span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;font-weight:800}
.creditroll p b{font-weight:700;font-size:15.5px}

@media (max-width:900px){
  .ins,.opts,.ready,.pgrid,.lines{grid-template-columns:minmax(0,1fr)}
  .sh-top{grid-template-columns:150px minmax(0,1fr)}
  .sh-top .secs{grid-column:2;justify-self:start}
}
@media (max-width:600px){
  .tabs{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tab{flex-direction:column;gap:4px;font-size:15px;padding:8px 6px;text-align:center}
  .voices3,.ctrls,.two{grid-template-columns:minmax(0,1fr)}
  .sh-top{grid-template-columns:minmax(0,1fr)}
  .sh-top .secs{grid-column:auto}
  .tools4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sb{grid-template-columns:70px minmax(0,1fr) 40px}
  .tl b{font-size:16px}.tl span{display:none}
  .bs b{font-size:22px}.bs span{font-size:11px}.bs{padding:6px 8px}
}

</style>
</head>

function fix(p){
  const b=blank(); if(!p||typeof p!=="object") return b;
  const o=Object.assign(b,p);

}

function narrPrompt(){
  const n=S.charName.trim();
  const who=n?`My main character is ${n}${S.charLook.trim()?`, ${lookLc()}`:""}.`:"Work out my main character's name and look from the storyboard.";
  const NAME=(n||"CHARACTER NAME").toUpperCase();
  return `I'm making a 60-second animated film for school. I've attached my storyboard: six frames, in order, with my notes.
${who}

Write the narration script for my film in EXACTLY this format, with nothing before or after it:

TITLE: a short film title
CHARACTER: name – one line about how they look

Scene 1
PICTURE: what this storyboard frame shows, in one short sentence
NARRATOR: 1–2 short sentences about what the picture can't show (thoughts, feelings, time passing)
${NAME}: one short line they say out loud (leave this line out if nobody speaks)
SFX: [one sound effect] (leave this line out if the scene doesn't need one)

Repeat for Scene 2 to Scene 6.

Rules:
- 120–150 spoken words in total (NARRATOR + character lines), about 20–25 per scene
- About 75% narrator and 25% character lines
- 2–4 sound effects in the whole film, only where they matter
- Never describe what is already visible in the picture
- Keep my story exactly as it is: no new events or characters
- Simple, spoken English that sounds natural read aloud
- No bold, no emojis, no extra notes`;
}
const NOISE=/^(none|n\/?a|no|nothing|-+|—|–|\(none\)|no sound|no sfx)\.?$/i;
function parseScript(raw){
  const txt=String(raw||"").replace(/\r/g,"").replace(/\*\*|__|^#+\s?/gm,"").replace(/[“”]/g,'"').replace(/\t/g," ");
  const out={lines:Array.from({length:6},()=>({pic:"",narr:"",who:"",say:"",sfx:""})),title:"",charName:"",charLook:""};
  const tm=txt.match(/^[ \t>*\-•]*(?:film\s+)?title\s*:\s*(.+)$/im); if(tm) out.title=tm[1].trim().replace(/^"|"$/g,"");
  const cm=txt.match(/^[ \t>*\-•]*(?:main\s+)?characters?\s*:\s*(.+)$/im);
  if(cm){ const parts=cm[1].trim().split(/\s+[–—-]\s+|\s*:\s+|,\s+|\s+\(/); out.charName=parts[0].replace(/[()"]/g,"").trim().slice(0,30); out.charLook=cm[1].trim().slice(parts[0].length).replace(/^\s*([–—\-:,(]\s*)/,"").replace(/\)\s*$/,"").trim().slice(0,90); }
  const re=/(^|\n)[ \t>*\-•]*scene\s*(\d{1,2})\b[^\n]*/gi; const marks=[]; let m;
  while((m=re.exec(txt))) marks.push({n:+m[2],i:m.index+m[1].length,end:re.lastIndex,head:m[0].trim()});
  if(!marks.length) return null;
  const known=[S.charName.trim().toUpperCase(),out.charName.toUpperCase()].filter(Boolean);
  const properName=out.charName||S.charName.trim();
  marks.forEach((mk,k)=>{
    const idx=mk.n-1; if(idx<0||idx>5) return; const L=out.lines[idx];
    const headRest=mk.head.replace(/^[\s>*\-•]*scene\s*\d{1,2}\b\s*(\([^)]*\))?\s*[:\-–—.]?\s*/i,"").replace(/^(setup|problem|rising action|rising|climax|resolution)\b\s*[)\]:\-–—.]?\s*/i,"");
    const body=headRest+"\n"+txt.slice(mk.end,k+1<marks.length?marks[k+1].i:undefined);
    body.split("\n").map(l=>l.trim().replace(/^[-*•]\s*/,"")).filter(Boolean).forEach(l=>{
      const lm=l.match(/^([A-Za-z][\w .'’\-]{0,24}?)\s*(\([^)]*\))?\s*:\s*(.*)$/);
      if(lm){
        const lab=lm[1].trim().toUpperCase(), t=lm[3].trim();
        if(!t||NOISE.test(t.replace(/^\[|\]$/g,"").trim())) return;
        if(/^NARRAT/.test(lab)) L.narr=(L.narr+" "+t).trim();
        else if(/^(SFX|SOUND|SOUNDS|SOUND EFFECTS?|FX)$/.test(lab)) L.sfx=(L.sfx+" "+t.replace(/^\[|\]$/g,"")).trim();
        else if(/^(PICTURE|WE SEE|VISUAL|VISUALS|IMAGE|FRAME|SHOT|ON SCREEN)$/.test(lab)) L.pic=(L.pic+" "+t).trim();
        else if(/^(SCENE|SETUP|PROBLEM|RISING|CLIMAX|RESOLUTION|TITLE|NOTE|NOTES|DURATION|TIME|WORDS?|WORD COUNT|TOTAL)/.test(lab)) {}
        else {
          const said=t.replace(/^"|"$/g,"");
          const who=(/^CHARACTER( NAME)?$/.test(lab)||known.includes(lab))?(properName||titleCase(lm[1].trim())):titleCase(lm[1].trim());
          if(!L.say){ L.who=who; L.say=said; } else L.say+=" "+said;
        }
      } else if(/^\[.*\]$/.test(l)) L.sfx=(L.sfx+" "+l.slice(1,-1)).trim();
      else if(!/^(here'?s|hope|i hope|let me know|total|word count|\(\d+)/i.test(l)) L.narr=(L.narr+" "+l).trim();
    });
  });
  return out.lines.some(r=>r.narr||r.say)?out:null;
}
function stats(){
  let nW=0,cW=0,sfx=0,nL=0,cL=0; const chars={};
  S.script.forEach(r=>{ const a=wc(r.narr), b=wc(r.say); nW+=a; cW+=b; if(a) nL++; if(b){ cL++; const k=(r.who||S.charName||"Character").trim()||"Character"; chars[k]=(chars[k]||0)+b; } if(r.sfx.trim()) sfx++; });
  const words=nW+cW; return {nW,cW,nL,cL,sfx,words,nS:nW/2.5,cS:cW/2.5,sS:sfx*2,chars,share:words?nW/words:0};
}
const SEEWORDS=/\b(we see|you can see|we can see|in this (scene|picture|frame|shot)|is shown|appears on (the )?screen|the camera)\b/i;
function coachNotes(){
  const t=stats(), out=[];
  if(!t.words) return [["fix","Paste and split your script to get coach notes."]];
  if(t.words<120) out.push(["fix",`Add about ${120-t.words} more words. Your film will feel rushed under 120.`]);
  else if(t.words>150) out.push(["fix",`Cut about ${t.words-150} words. Over 150 won't fit in 60 seconds.`]);
  else out.push(["ok",`${t.words} words: a perfect length for 60 seconds.`]);
  const np=Math.round(t.share*100);
  if(!t.cW) out.push(["fix",`Nobody speaks yet. Give ${nm()} one short line in a big moment, like the problem or the climax.`]);
  else if(np>85) out.push(["fix",`The narrator has ${np}% of the words. Give ${nm()} one more short line.`]);
  else if(np<65) out.push(["fix",`Characters have ${100-np}% of the words. Let the narrator carry more of the story.`]);
  else out.push(["ok",`Narrator ${np}% · characters ${100-np}%: a great balance.`]);
  if(!t.sfx) out.push(["fix","No sound effects yet. Add 2–4 where something big happens."]);
  else if(t.sfx>4) out.push(["fix",`${t.sfx} sound effects is a lot. Keep the 2–4 that matter most.`]);
  else if(t.sfx<2) out.push(["fix","Add one more sound effect at a big moment."]);
  else out.push(["ok",`${t.sfx} sound effects: just right.`]);
  S.script.forEach((r,i)=>{
    const w=wc(r.narr)+wc(r.say);
    if(!r.narr.trim()&&!r.say.trim()) out.push(["fix",`Scene ${i+1} has no lines yet.`]);
    else if(w>32) out.push(["fix",`Scene ${i+1} is long (${w} words). Trim it to about 25.`]);
    if(SEEWORDS.test(r.narr)) out.push(["fix",`Scene ${i+1}: the narrator describes the picture. Say what it can't show instead: a thought or a feeling.`]);
    if(wc(r.say)>14) out.push(["fix",`Scene ${i+1}: the character line is long. Keep spoken lines under 12 words.`]);
  });
  const ed=S.script.filter(lineEdited).length;
  if(ed<6) out.push(["fix",`You've changed ${ed} of 6 scenes. Make every scene sound like you.`]);
  else out.push(["ok","Every scene has your own touch. Nice!"]);
  return out;
}

function scriptText(){
  const lines=[]; if(S.title.trim()) lines.push(`TITLE: ${S.title.trim()}`,"");
  S.script.forEach((r,i)=>{ lines.push(`Scene ${i+1} (${STAGES[i]})`); if(r.narr.trim()) lines.push(`NARRATOR: ${r.narr.trim()}`); if(r.say.trim()) lines.push(`${(r.who||nm()).toUpperCase()}: ${r.say.trim()}`); if(r.sfx.trim()) lines.push(`SFX: [${r.sfx.trim()}]`); lines.push(""); });
  return lines.join("\n").trim();
}

const rx=w=>new RegExp(`\\b(${w})\\w*`,"gi");
const ACT=rx("run|ran|jump|fly|flies|flew|fall|fell|crash|chase|burst|explod|rush|spin|danc|grab|throw|threw|storm|pour|race|fight|kick|swing|swung|leap|zoom|lift|soar|dive|escape|catch|caught|smash|tumble|wobbl|launch|charg|climb|slid|splash|shak|bounc|sprint|roar|blast|whoosh|swoop|rais|reach|push|pull|float");
const EMO=rx("cry|cries|cried|tear|smil|grin|whisper|scared|afraid|nervous|heart|sad|happy|proud|worr|sigh|shy|blush|gulp|hope|wish|think|thought|feel|felt|lonely");
const MOODW={dark:rx("dark|night|storm|thunder|scary|scared|scream|afraid|fear|shadow|danger|tense|monster|trap|creep|haunt|lightning"),cool:rx("sad|lonely|alone|cry|cried|tear|rain|quiet|miss|empty|cold|gloom|sorry|hide|hid|grey|gray|lost|silent"),warm:rx("happy|smil|laugh|joy|cheer|sunny|sunshine|sunlight|rainbow|wins?\\b|winner|won\\b|friend|hug|proud|celebrat|bright|home|together|glow|warm|gold")};
const STAGE_MOOD=["warm","cool","cool","cool","dark","warm"], STAGE_TECH=["zoom","pop","rise","path","pop","fade"], STAGE_PTS=[0,2,1,1,3,1];
const cnt=(re,s)=>(String(s||"").match(re)||[]).length;
const allTxt=r=>`${r.pic} ${r.narr} ${r.say} ${r.sfx}`;
function sh(i){ if(!S.shots[i]) S.shots[i]={type:"",cam:"",mood:"",action:"",fixes:{},img:false,clip:false,tech:"",tries:0,tools:{}}; const o=S.shots[i]; if(!o.fixes) o.fixes={}; if(!o.tools) o.tools={}; return o; }
function heroScores(){ return S.script.map((r,i)=>STAGE_PTS[i]+Math.min(3,cnt(ACT,allTxt(r)))+(/!/.test(r.say)?1:0)+(r.sfx.trim()?1:0)+i*.01); }
function recType(i){ const sc=heroScores(); const top=sc.map((s,k)=>[s,k]).sort((a,b)=>b[0]-a[0]).slice(0,2).map(x=>x[1]); return top.includes(i)?"clip":"still"; }
function recWhy(i){ const r=S.script[i], a=cnt(ACT,allTxt(r)), bits=[];
  if(i===4) bits.push("it's your climax"); else if(i===1) bits.push("it's where the problem hits");
  if(a) bits.push(a>1?"lots of action":"there's action"); if(r.sfx.trim()) bits.push("it has a sound effect"); if(/!/.test(r.say)) bits.push("a big line is spoken");
  return bits.length?bits.join(", "):"it's one of your strongest moments"; }
function autoCam(i){ const r=S.script[i], t=allTxt(r), a=cnt(ACT,t), e=cnt(EMO,t); if(i===0||i===5) return "wide"; if(e>a) return "close"; if(a) return "medium"; return r.say.trim()?"close":"medium"; }
function autoMood(i){ const t=allTxt(S.script[i]); const sc=Object.entries(MOODW).map(([k,re])=>[k,cnt(re,t)]).sort((a,b)=>b[1]-a[1]); return sc[0][1]>0?sc[0][0]:STAGE_MOOD[i]; }
const typeOf=i=>sh(i).type||recType(i), camOf=i=>sh(i).cam||autoCam(i), moodOf=i=>sh(i).mood||autoMood(i), techOf=i=>sh(i).tech||STAGE_TECH[i];
const CAM={wide:["Wide","a wide shot that shows the whole place","Wide shot; the camera slowly pans across the scene"],medium:["Medium","a medium shot, the character from the waist up","Medium shot; a steady camera follows the character"],close:["Close-up","a close-up on the character's face, so we feel what they feel","Close-up on the character's face; the camera slowly pushes in"]};

  const vids=new Set(), imgs=new Set();
  Object.values(S.shots).forEach(h=>{ Object.keys(h.tools||{}).forEach(t=>{ if(!h.tools[t]) return; if(TOOLNAME[t]) vids.add(TOOLNAME[t]); else imgs.add(t); }); });
  const out=[["Story, storyboard & script",f],["Narration ideas from",`${S.used.narr||"an AI chat assistant"}, edited by ${f}`],["Voices & sound effects","ElevenLabs (elevenlabs.io)"]];
  if(imgs.size||S.used.ref) out.push(["Pictures made with",[...new Set([...(S.used.ref?[S.used.ref]:[]),...imgs])].join(", ")]);
  out.push(["AI video",[...vids].join(", ")||"Canva AI"],["Animation & editing","Canva"],["Made at","PUMO Story Lab · SMK Puchong"]);
  return out;
}

const ST=[
  {id:"narration",n:1,label:"Narration",small:"Script from your storyboard",color:"#C7B8FF",sprite:"chatty"},
  {id:"voice",n:2,label:"Voices",small:"ElevenLabs",color:"#FFC9A6",sprite:"pumo"},

];
$("#tabs").innerHTML=ST.map((s,i)=>`<a class="tab jiggle" href="#${s.id}" data-id="${s.id}" style="--tabc:${s.color}"><span class="n">${s.n}</span><span>${s.label}<small>${s.small}</small></span>${hang(s.sprite,38,14,`left:50%;top:calc(100% + 3px);--dur:${3+i*.35}s;--del:-${i*.6}s`)}</a>`).join("");
const VIEWS={narration:vNarration,voice:vVoice,video:vVideo};
let cleanup=null;
function route(){
  if(cleanup){cleanup();cleanup=null;}
  if(window.speechSynthesis) try{speechSynthesis.cancel();}catch(e){}
  const id=(location.hash||"").slice(1); const key=VIEWS[id]?id:"narration"; const st=ST.find(s=>s.id===key);
  $$("#tabs .tab").forEach(a=>{ if(a.dataset.id===key) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  cleanup=VIEWS[key]($("#view"),st)||null;
}
window.addEventListener("hashchange",()=>{ route(); const t=$("#tabs"); const y=t.getBoundingClientRect().top+scrollY-12; if(scrollY>y) scrollTo({top:y}); });
route();
})();
